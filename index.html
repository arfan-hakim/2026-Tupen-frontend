<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tupen - Sistem Peminjaman Ruangan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">Peminjaman Ruangan Kampus<span>.</span></h1>
            <ul class="nav-links">
                <li><a href="index.html" class="active">Daftar Ruangan</a></li>
                <li><a href="peminjaman.html">Peminjaman Saya</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <header class="page-header">
            <h2>Daftar Ruangan</h2>
            <p>Pilih ruangan yang ingin Anda gunakan untuk kegiatan perkuliahan.</p>
        </header>

        <section id="room-list" class="room-grid">
    <div class="room-card">
        <div class="room-badge">Tersedia</div>
        <div class="room-info">
            <h3>Lab Komputer A.101</h3>
            <p class="room-meta">Gedung A • Lantai 1</p>
            <div class="room-details">
                <span><strong>Kapasitas:</strong> 40 Orang</span>
            </div>
            <button class="btn-book">Pesan Sekarang</button>
        </div>
    </div>
    
    </section>
    </main>

    <footer>
        <p>&copy; 2026 Tupen Backend Project. Built with .NET & Pure CSS.</p>
    </footer>

    <script>
    const API_URL = 'http://localhost:5145/api'; // Sesuaikan port backend kamu

    async function loadRooms() {
        try {
            const response = await fetch(`${API_URL}/Rooms`);
            const rooms = await response.json();
            
            const container = document.getElementById('room-list');
            container.innerHTML = ''; // Hapus blueprint/loading

            rooms.forEach(room => {
                container.innerHTML += `
                    <div class="room-card">
                        <div class="room-badge">Tersedia</div>
                        <div class="room-info">
                            <h3>${room.name}</h3>
                            <p class="room-meta">${room.roomNumber}</p>
                            <div class="room-details">
                                <span><strong>Kapasitas:</strong> ${room.capacity} Orang</span>
                            </div>
                            <button class="btn-book" onclick="location.href='peminjaman.html?roomId=${room.id}'">
                                Pesan Sekarang
                            </button>
                        </div>
                    </div>
                `;
            });
        } catch (error) {
            console.error('Gagal mengambil data ruangan:', error);
        }
    }

    // Jalankan fungsi saat halaman dimuat
    document.addEventListener('DOMContentLoaded', loadRooms);
</script>
</body>
</html>
